<!-- The Hague Justice Week 2026 - programme of activities.
     This file is the component. The programme itself lives in events.json in this repo:
     to update the listing, replace that file. No change here is needed. -->
<div id="thjw-events" class="thjw-events">
  <div class="thjw-toolbar">
    <label class="thjw-search">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M9 2a7 7 0 105.3 11.6l3.5 3.6 1.4-1.4-3.5-3.6A7 7 0 009 2zm0 2a5 5 0 110 10A5 5 0 019 4z"/></svg>
      <input type="search" id="thjw-ev-q" placeholder="Search activities, hosts, topics" aria-label="Search activities" autocomplete="off">
    </label>
    <div class="thjw-filterblock">
      <div class="thjw-chiprow" id="thjw-ev-formats" role="group" aria-label="Filter by format"></div>
      <div class="thjw-chiprow" id="thjw-ev-tags" role="group" aria-label="Filter by topic"></div>
      <button type="button" class="thjw-clear" id="thjw-ev-clear" hidden>Clear filters</button>
    </div>
  </div>

  <div class="thjw-listhead" role="row">
    <button type="button" class="thjw-sort" data-sort="date" aria-label="Sort by date">Date <span class="thjw-arrow" aria-hidden="true"></span></button>
    <button type="button" class="thjw-sort" data-sort="title" aria-label="Sort by activity">Activity <span class="thjw-arrow" aria-hidden="true"></span></button>
    <button type="button" class="thjw-sort" data-sort="host" aria-label="Sort by host">Host <span class="thjw-arrow" aria-hidden="true"></span></button>
    <span class="thjw-headfmt">Format</span>
    <span class="thjw-headspacer" aria-hidden="true"></span>
  </div>

  <div id="thjw-ev-list" class="thjw-list"><p class="thjw-status">Loading the programme…</p></div>
  <p class="thjw-count" id="thjw-ev-count" aria-live="polite"></p>
</div>

<style>
#thjw-events{
  --e-navy:#17345e; --e-navy-soft:#3d5c88;
  --e-mint:#e5efe4; --e-mint-deep:#cbe0c8;
  --e-line:#dfe4ea; --e-muted:#5c6b82; --e-hair:#eef1f5;
  font-family:inherit;color:var(--e-navy);margin:0 0 1rem;-webkit-font-smoothing:antialiased}
#thjw-events *,#thjw-events *::before,#thjw-events *::after{box-sizing:border-box}
#thjw-events [hidden]{display:none!important}

/* toolbar */
#thjw-events .thjw-toolbar{display:flex;flex-direction:column;gap:1rem;margin:0 0 1.5rem}
#thjw-events .thjw-search{position:relative;display:flex;align-items:center;max-width:420px}
#thjw-events .thjw-search svg{position:absolute;left:.85rem;width:18px;height:18px;fill:var(--e-muted);pointer-events:none}
#thjw-events .thjw-search input{width:100%;font:inherit;font-size:1rem;color:var(--e-navy);
  padding:.7rem 1rem .7rem 2.6rem;border:1px solid var(--e-line);border-radius:999px;background:#fff;
  outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none}
#thjw-events .thjw-search input::placeholder{color:var(--e-muted);opacity:1}
#thjw-events .thjw-search input:focus{border-color:var(--e-navy);box-shadow:0 0 0 3px rgba(23,52,94,.12)}
#thjw-events .thjw-filterblock{display:flex;flex-direction:column;gap:.5rem;align-items:flex-start}
#thjw-events .thjw-chiprow{display:flex;flex-wrap:wrap;gap:.4rem}
#thjw-events .thjw-chip{font:inherit;font-size:.8rem;font-weight:600;line-height:1;cursor:pointer;
  padding:.45rem .75rem;border-radius:999px;border:1px solid var(--e-line);background:#fff;color:var(--e-muted);
  transition:background .15s,color .15s,border-color .15s}
#thjw-events .thjw-chip:hover{border-color:var(--e-navy);color:var(--e-navy)}
#thjw-events .thjw-chip[aria-pressed="true"]{background:var(--e-navy);border-color:var(--e-navy);color:#fff}
#thjw-events .thjw-chip.is-format[aria-pressed="true"]{background:var(--e-navy)}
#thjw-events .thjw-clear{font:inherit;font-size:.8rem;cursor:pointer;background:none;border:none;padding:.2rem 0;
  color:var(--e-muted);text-decoration:underline;text-underline-offset:3px}
#thjw-events .thjw-clear:hover{color:var(--e-navy)}

/* list header */
#thjw-events .thjw-listhead{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 12rem 6.5rem 2rem;
  gap:1rem;align-items:center;padding:0 .9rem .6rem;border-bottom:2px solid var(--e-line)}
#thjw-events .thjw-sort,#thjw-events .thjw-headfmt{font:inherit;font-size:.72rem;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--e-muted);text-align:left}
#thjw-events .thjw-sort{background:none;border:none;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
#thjw-events .thjw-sort:hover{color:var(--e-navy)}
#thjw-events .thjw-sort[data-active]{color:var(--e-navy)}
#thjw-events .thjw-arrow::after{content:"";display:inline-block;width:0;height:0;
  border-left:4px solid transparent;border-right:4px solid transparent}
#thjw-events .thjw-sort[data-active="asc"] .thjw-arrow::after{border-bottom:5px solid currentColor}
#thjw-events .thjw-sort[data-active="desc"] .thjw-arrow::after{border-top:5px solid currentColor}

/* rows */
#thjw-events .thjw-list{display:flex;flex-direction:column}
#thjw-events .thjw-ev{border-bottom:1px solid var(--e-hair)}
#thjw-events .thjw-head{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 12rem 6.5rem 2rem;
  gap:1rem;align-items:start;width:100%;text-align:left;font:inherit;color:inherit;
  background:none;border:none;cursor:pointer;padding:1rem .9rem;border-radius:10px;
  transition:background .15s}
#thjw-events .thjw-head:hover,
#thjw-events .thjw-head[aria-expanded="true"]{background:var(--e-mint)}
#thjw-events .thjw-head:focus-visible{outline:2px solid var(--e-navy);outline-offset:-2px}
#thjw-events .thjw-date{font-size:.86rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.4}
#thjw-events .thjw-date .thjw-time{display:block;font-weight:400;color:var(--e-muted);font-size:.8rem}
#thjw-events .thjw-date.is-tbc{font-weight:600;color:var(--e-muted)}
#thjw-events .thjw-title{font-size:.98rem;font-weight:600;line-height:1.4;margin:0}
#thjw-events .thjw-tags{display:flex;flex-wrap:wrap;gap:.3rem;margin:.45rem 0 0;padding:0;list-style:none}
#thjw-events .thjw-tag{font-size:.7rem;font-weight:600;line-height:1;padding:.28rem .5rem;border-radius:4px;
  background:var(--e-mint);color:var(--e-navy)}
#thjw-events .thjw-host{font-size:.86rem;line-height:1.4;color:var(--e-muted)}
#thjw-events .thjw-host.is-tbc{font-style:italic}
#thjw-events .thjw-fmt{font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.35rem;color:var(--e-navy);white-space:nowrap}
#thjw-events .thjw-fmt::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
#thjw-events .thjw-fmt[data-f="Online"]{color:#1a6a6a}
#thjw-events .thjw-fmt[data-f="Hybrid"]{color:#7a4b13}
#thjw-events .thjw-chev{justify-self:end;align-self:center;width:1.1rem;height:1.1rem;
  color:var(--e-muted);transition:transform .2s ease}
#thjw-events .thjw-head[aria-expanded="true"] .thjw-chev{transform:rotate(180deg)}

/* expanded panel */
#thjw-events .thjw-body{padding:0 .9rem 1.6rem;display:grid;gap:1.4rem;
  grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
#thjw-events .thjw-desc{margin:0;font-size:.92rem;line-height:1.6;white-space:pre-line;max-width:62ch}
#thjw-events .thjw-meta{margin:0;display:grid;gap:.85rem;font-size:.86rem}
#thjw-events .thjw-meta dt{font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--e-muted);margin:0 0 .18rem}
#thjw-events .thjw-meta dd{margin:0;line-height:1.5}
#thjw-events .thjw-btn{display:inline-block;margin-top:.3rem;font:inherit;font-size:.86rem;font-weight:700;
  padding:.6rem 1.1rem;border-radius:999px;text-decoration:none;background:var(--e-navy);color:#fff;
  border:1px solid var(--e-navy);transition:background .15s}
#thjw-events a.thjw-btn:hover,#thjw-events a.thjw-btn:focus-visible{background:#0f2748;color:#fff}
#thjw-events .thjw-btn.is-pending{background:transparent;color:var(--e-muted);border-style:dashed;
  border-color:var(--e-line);font-weight:600;cursor:default}
#thjw-events .thjw-contact{margin:.6rem 0 0;font-size:.82rem;color:var(--e-muted);overflow-wrap:anywhere}
#thjw-events .thjw-contact a{color:inherit}
#thjw-events .thjw-status{margin:1.5rem .9rem;color:var(--e-muted)}
#thjw-events .thjw-count{margin:1rem .9rem 0;font-size:.85rem;color:var(--e-muted);font-variant-numeric:tabular-nums}

@media (max-width:820px){
  #thjw-events .thjw-listhead{display:none}
  #thjw-events .thjw-head{grid-template-columns:minmax(0,1fr) 1.6rem;gap:.5rem 1rem;padding:1rem .6rem}
  #thjw-events .thjw-date{grid-row:1;order:1}
  #thjw-events .thjw-titlewrap{grid-column:1;order:3}
  #thjw-events .thjw-host{grid-column:1;order:4}
  #thjw-events .thjw-fmt{grid-column:1;order:5;margin-top:.15rem}
  #thjw-events .thjw-chev{grid-column:2;grid-row:1;order:2}
  #thjw-events .thjw-body{grid-template-columns:minmax(0,1fr);padding:0 .6rem 1.4rem}
}
@media (prefers-reduced-motion:reduce){
  #thjw-events .thjw-head,#thjw-events .thjw-chev{transition:none}
}
</style>

<script>
(function(){
  var ROOT = "https://cdn.jsdelivr.net/gh/thehaguehumanityhub/justice-week-events@main/";
  var DATA = ROOT + "events.json";

  var root = document.getElementById("thjw-events");
  if(!root) return;
  var listEl  = root.querySelector("#thjw-ev-list"),
      countEl = root.querySelector("#thjw-ev-count"),
      qEl     = root.querySelector("#thjw-ev-q"),
      fmtRow  = root.querySelector("#thjw-ev-formats"),
      tagRow  = root.querySelector("#thjw-ev-tags"),
      clearEl = root.querySelector("#thjw-ev-clear");

  var EVENTS = [], activeTags = [], activeFormats = [],
      sortKey = "date", sortDir = "asc";

  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function norm(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text != null) n.textContent = text;
    return n;
  }
  function parseDate(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");
    return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
  }
  function dateLabel(e){
    var d = parseDate(e.date);
    if(!d) return null;
    return DAYS[d.getDay()].slice(0,3) + " " + d.getDate() + " " + MONTHS[d.getMonth()].slice(0,3);
  }
  function timeLabel(e){
    if(!e.start) return "";
    return e.end ? e.start + "–" + e.end : e.start;
  }

  function buildChips(row, values, active, cls){
    values.forEach(function(v){
      var b = el("button", "thjw-chip" + (cls ? " " + cls : ""), v);
      b.type = "button";
      b.setAttribute("aria-pressed","false");
      b.addEventListener("click", function(){
        var i = active.indexOf(v);
        if(i === -1) active.push(v); else active.splice(i,1);
        b.setAttribute("aria-pressed", i === -1 ? "true" : "false");
        render();
      });
      row.appendChild(b);
    });
  }

  function makeRow(e){
    var wrap = el("div","thjw-ev");
    var head = el("button","thjw-head");
    head.type = "button";
    head.setAttribute("aria-expanded","false");
    head.id = "thjw-h-" + e.id;

    var dl = dateLabel(e);
    var dateEl = el("span","thjw-date" + (dl ? "" : " is-tbc"), dl || "Date to follow");
    if(dl && timeLabel(e)) dateEl.appendChild(el("span","thjw-time", timeLabel(e)));

    var titleWrap = el("div","thjw-titlewrap");
    titleWrap.appendChild(el("p","thjw-title", e.title));
    if(e.tags && e.tags.length){
      var ul = el("ul","thjw-tags");
      e.tags.forEach(function(t){ ul.appendChild(el("li","thjw-tag", t)); });
      titleWrap.appendChild(ul);
    }

    var hostEl = el("span","thjw-host" + (e.host ? "" : " is-tbc"), e.host || "Host to be confirmed");
    var fmtEl  = el("span","thjw-fmt", e.format || "");
    if(e.format) fmtEl.setAttribute("data-f", e.format);

    var chev = document.createElementNS("http://www.w3.org/2000/svg","svg");
    chev.setAttribute("class","thjw-chev");
    chev.setAttribute("viewBox","0 0 20 20");
    chev.setAttribute("aria-hidden","true");
    var path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d","M5 7.5L10 12.5L15 7.5");
    path.setAttribute("fill","none");
    path.setAttribute("stroke","currentColor");
    path.setAttribute("stroke-width","2");
    path.setAttribute("stroke-linecap","round");
    path.setAttribute("stroke-linejoin","round");
    chev.appendChild(path);

    head.appendChild(dateEl); head.appendChild(titleWrap);
    head.appendChild(hostEl); head.appendChild(fmtEl); head.appendChild(chev);

    var body = el("div","thjw-body");
    body.id = "thjw-b-" + e.id;
    body.hidden = true;
    body.setAttribute("role","region");
    body.setAttribute("aria-labelledby", head.id);

    if(e.description) body.appendChild(el("p","thjw-desc", e.description));

    var dlst = el("dl","thjw-meta");
    function pair(label, value){
      if(!value) return;
      dlst.appendChild(el("dt", null, label));
      dlst.appendChild(el("dd", null, value));
    }
    var when = dl ? (dl + (timeLabel(e) ? ", " + timeLabel(e) : "")) : "To be confirmed";
    pair("When", when);
    // Format is already shown as a badge on the row, so it is not repeated here.
    pair("Where", e.venue || (e.format === "Online" ? "Online" : "Venue to be confirmed"));
    pair("Who it is for", (e.audience||[]).join(", "));

    var regWrap = el("div");
    if(e.register){
      var a = el("a","thjw-btn","Register");
      a.href = e.register; a.target = "_blank"; a.rel = "noopener noreferrer";
      regWrap.appendChild(a);
    } else {
      regWrap.appendChild(el("span","thjw-btn is-pending","Registration opens soon"));
    }
    if(e.contact){
      var c = el("p","thjw-contact");
      c.appendChild(document.createTextNode("Contact: "));
      if(/^[^@\s]+@[^@\s]+$/.test(e.contact)){
        var mail = el("a", null, e.contact);
        mail.href = "mailto:" + e.contact;
        c.appendChild(mail);
      } else {
        c.appendChild(document.createTextNode(e.contact));
      }
      regWrap.appendChild(c);
    }
    dlst.appendChild(el("dt", null, "Registration"));
    var ddReg = el("dd");
    ddReg.appendChild(regWrap);
    dlst.appendChild(ddReg);
    body.appendChild(dlst);

    head.setAttribute("aria-controls", body.id);
    head.addEventListener("click", function(){
      var open = head.getAttribute("aria-expanded") === "true";
      head.setAttribute("aria-expanded", open ? "false" : "true");
      body.hidden = open;
    });

    wrap.appendChild(head); wrap.appendChild(body);
    e._el = wrap;
    e._search = norm([e.title, e.host, (e.tags||[]).join(" "), (e.audience||[]).join(" "),
                      e.description, e.format, e.venue].join(" "));
    return wrap;
  }

  function compare(a,b){
    var r = 0;
    if(sortKey === "date"){
      var da = parseDate(a.date), db = parseDate(b.date);
      if(!da && !db) r = a.title.localeCompare(b.title);
      else if(!da) return 1;            // undated always last, both directions
      else if(!db) return -1;
      else r = da - db || (a.start||"").localeCompare(b.start||"") || a.title.localeCompare(b.title);
    } else if(sortKey === "host"){
      r = (a.host||"￿").localeCompare(b.host||"￿") || a.title.localeCompare(b.title);
    } else {
      r = a.title.localeCompare(b.title);
    }
    return sortDir === "asc" ? r : -r;
  }

  function render(){
    var term = norm(qEl.value.trim());
    var shown = EVENTS.filter(function(e){
      if(term && e._search.indexOf(term) === -1) return false;
      if(activeFormats.length && activeFormats.indexOf(e.format) === -1) return false;
      if(activeTags.length && !activeTags.every(function(t){ return (e.tags||[]).indexOf(t) !== -1; })) return false;
      return true;
    });
    shown.sort(compare);

    listEl.textContent = "";
    if(!shown.length){
      listEl.appendChild(el("p","thjw-status","No activity matches those filters."));
    } else {
      shown.forEach(function(e){ listEl.appendChild(e._el); });
    }
    var filtered = term || activeFormats.length || activeTags.length;
    countEl.textContent = filtered
      ? shown.length + " of " + EVENTS.length + " activities"
      : EVENTS.length + " activities";
    clearEl.hidden = !filtered;
  }

  root.querySelectorAll(".thjw-sort").forEach(function(btn){
    btn.addEventListener("click", function(){
      var key = btn.getAttribute("data-sort");
      if(sortKey === key){ sortDir = sortDir === "asc" ? "desc" : "asc"; }
      else { sortKey = key; sortDir = "asc"; }
      root.querySelectorAll(".thjw-sort").forEach(function(b){ b.removeAttribute("data-active"); });
      btn.setAttribute("data-active", sortDir);
      render();
    });
  });
  qEl.addEventListener("input", render);
  clearEl.addEventListener("click", function(){
    qEl.value = "";
    activeTags.length = 0; activeFormats.length = 0;
    root.querySelectorAll(".thjw-chip").forEach(function(b){ b.setAttribute("aria-pressed","false"); });
    render();
    qEl.focus();
  });

  fetch(DATA, {cache:"no-cache"}).then(function(r){
    if(!r.ok) throw new Error("http " + r.status);
    return r.json();
  }).then(function(d){
    EVENTS = (d && d.events ? d.events : []).filter(function(e){ return e && e.title; });
    if(!EVENTS.length){
      listEl.textContent = "";
      listEl.appendChild(el("p","thjw-status","The programme will be published here shortly."));
      return;
    }
    var formats = [], tags = [];
    EVENTS.forEach(function(e){
      if(e.format && formats.indexOf(e.format) === -1) formats.push(e.format);
      (e.tags||[]).forEach(function(t){ if(tags.indexOf(t) === -1) tags.push(t); });
    });
    formats.sort(); tags.sort();
    buildChips(fmtRow, formats, activeFormats, "is-format");
    buildChips(tagRow, tags, activeTags, null);
    EVENTS.forEach(makeRow);
    root.querySelector('.thjw-sort[data-sort="date"]').setAttribute("data-active","asc");
    render();
  }).catch(function(){
    listEl.textContent = "";
    listEl.appendChild(el("p","thjw-status","The programme could not be loaded just now. Please try again shortly."));
  });
})();
</script>
